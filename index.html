<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPA | Interpol Kripto ve İstihbarat Paneli</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: 450px;
            background-image: url('logo.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 500px;
            position: relative;
            z-index: 1;
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            text-align: center;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #f8fafc;
            font-size: 15px;
            box-sizing: border-box;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .btn-container {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-encrypt {
            background-color: #0284c7;
            color: white;
        }
        .btn-encrypt:hover {
            background-color: #0369a1;
        }
        .btn-decrypt {
            background-color: #334155;
            color: white;
        }
        .btn-decrypt:hover {
            background-color: #475569;
        }
        .btn-copy {
            background-color: #10b981;
            color: white;
            margin-top: 10px;
            width: 100%;
        }
        .btn-copy:hover {
            background-color: #059669;
        }
        .footer-tag {
            position: fixed;
            bottom: 15px;
            right: 20px;
            font-size: 13px;
            font-weight: bold;
            color: #64748b;
            font-family: monospace;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>

            <textarea id="inputText" rows="4" placeholder="Şifrelenecek veya çözülecek metni buraya girin..."></textarea>
        </div>
