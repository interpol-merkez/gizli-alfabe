<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPA | Interpol Kripto ve İstihbarat Paneli</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: 450px;
            background-image: url('logo.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 500px;
            position: relative;
            z-index: 1;
        }
        /* Sağ alt imza alanı tasarımı */
        .signature-footer {
            position: fixed;
            bottom: 15px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 10;
            opacity: 0.85;
            pointer-events: none;
        }
        .signature-footer .creator {
            font-size: 13px;
            font-weight: bold;
            color: #94a3b8;
            letter-spacing: 1px;
            margin-bottom: 3px;
            font-family: monospace;
        }
        .signature-footer img {
            height: 40px;
            filter: brightness(0) invert(1); /* İmzayı beyaz yapar */
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>TPA Kripto Paneli</h2>
        <p>Sistem aktif ve güvenli bağlantı kuruldu.</p>
        <!-- Buraya kendi şifreleme/çözme kutularını ekleyebilirsin -->
    </div>

    <!-- Sağ Alt İmza ve Atatürk İmzası Bölümü -->
    <div class="signature-footer">
        <span class="creator">by.cmyl65</span>
        <img src="ataturk-imza.png" alt="Atatürk İmzası">
    </div>
</body>
</html>
